name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint Swift formatting
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # дефолтный Xcode 16.4 несёт swift-format, не читающий новые ключи .swift-format
      - name: Select Xcode with modern swift-format
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Lint
        run: xcrun swift-format lint --strict --recursive --configuration .swift-format Sources Tests

  build:
    name: Build macOS app
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build debug
        run: swift build

      - name: Run tests
        run: swift test

      - name: Build app bundle
        run: ./scripts/build_app.sh

      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: translate-go-app
          path: .build/translate&go.app

name: Release DMG

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-dmg:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install DMG builder
        run: npm install --global create-dmg

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION#.}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Sources/OllamaTranslatorApp/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" Sources/OllamaTranslatorApp/Info.plist

      - name: Build DMG
        run: ./scripts/build_dmg.sh

      - name: Upload DMG to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: .build/translate-go.dmg
